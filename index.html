<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Задание 2: MindAR + A-Frame Image Tracking</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-aframe.prod.js"></script>
    <style>body { margin: 0; padding: 0; overflow: hidden; background: #000; }</style>
</head>
<body>
    <a-scene 
        mindar-image="imageTargetSrc: targets.mind; autoStart: true;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
        <a-assets>
            <a-asset-item id="robotModel" src="assets/RobotExpressive.glb"></a-asset-item>
        </a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model src="#robotModel" position="0 0 0" rotation="0 0 0" scale="0.01 0.01 0.01"></a-gltf-model>
            <a-light type="ambient" color="#FFFFFF" intensity="0.8"></a-light>
            <a-light type="directional" position="1 2 1" intensity="0.6"></a-light>
        </a-entity>
    </a-scene>
</body>
</html>
